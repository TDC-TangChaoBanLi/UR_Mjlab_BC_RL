[project]
name = "lerobot_policy_ur5_multimodal"
version = "0.1.0"
description = "UR5 Multimodal BC Policy for LeRobot"
requires-python = ">=3.10"
dependencies = [
    "ur-mjlab-bc-rl",
    "lerobot>=0.6.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"lerobot_policy_ur5_multimodal" = "src/lerobot_policy_ur5_multimodal"
