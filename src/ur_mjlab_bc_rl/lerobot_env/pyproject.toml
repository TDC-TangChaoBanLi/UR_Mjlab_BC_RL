[project]
name = "lerobot_env_ur5e_dual"
version = "0.1.0"
description = "UR5e Dual-Arm MuJoCo Environment for LeRobot"
requires-python = ">=3.10"
dependencies = [
    "ur-mjlab-bc-rl",
    "lerobot>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_env_ur5e_dual"]
