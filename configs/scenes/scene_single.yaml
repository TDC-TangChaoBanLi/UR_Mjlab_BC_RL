
# ── 机器人 ──
robot:
  - name: "ur5e" # 机器人名称，仅用于标识，与场景文件无关
    prefix: "" # 机器人前缀，用于修饰 joint \ site 的 name
    arm_joints:
      - ur_shoulder_pan_joint
      - ur_shoulder_lift_joint
      - ur_elbow_joint
      - ur_wrist_1_joint
      - ur_wrist_2_joint
      - ur_wrist_3_joint
    gripper_joints:
      - robotiq_85_left_knuckle_joint
    ee_site: "_tcp"
    default_qpos: [0.0, -1.32, 1.32, -1.57, -1.57, 0.0]

# ── 相机 ──
camera:
  - name: "realsense_link_CAMERA"
    fps: 30                     # 相机渲染帧率，控制仿环中的实际渲染频率
    image_size: [320, 240]      # 相机图像尺寸 (W, H)
    type: "rgb_depth"           # 相机类型， "gray" | "rgb" | "depth" | "rgb_depth"


